<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Grades</title>
</head>
<body>
	<form action="" id="exam-form">
		<label for="exam-score-input">Exam Score:</label>
		<input type="text" id="exam-score-input">
		<label for="exam-name-input">Exam Name:</label>
		<input type="text" id="exam-name-input">
		<label for="student-id-input">Student ID:</label>
		<input type="text" id="student-id-input">
		<button type="submit" id="add-exam-score-btn">Add Score</button>
	</form>
	<div class="table-container">
		<table class="exam-table">
			<thead>
			<tr>
				<th>#</th>
				<th>Title</th>
				<th>Score</th>
				<th>Student</th>
				<th>Actions</th>
			</tr>
			</thead>
			<tbody id="exam-tbody">
			<!-- Rows will be dynamically injected here -->
			</tbody>
		</table>
	</div>

	<script src="./js/core/grades.js"></script>
</body>
</html>
