<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack - Announcements Panel</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 font-sans">
    <div class="max-w-md mx-auto space-y-6">

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4">Broadcast Announcement</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Announcement Title</label>
                    <input type="text" id="announcement-title" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., Final Exam Schedule">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Announcement Body</label>
                    <textarea id="announcement-body" rows="3" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type notification details here..."></textarea>
                </div>
                <button id="broadcast-ann-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transition shadow text-sm">
                    Broadcast Announcement
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-4">Live Board Notice</h2>
            <div id="announcements-container" class="space-y-3 max-h-[300px] overflow-y-auto">
            </div>
        </div>

    </div>
    <script src="announcments.js"></script>
</body>
</html>
