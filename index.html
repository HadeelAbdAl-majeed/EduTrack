<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments Management</title>

    <link rel="stylesheet" href="./assets/styles/global.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">U</div>
                <h2>University Portal</h2>
            </div>

            <nav>

                <a href="#">
                    <span>▣</span>
                    Dashboard
                </a>

                <a href="#">
                    <span>▣</span>
                    Students
                </a>

                <a href="#">
                    <span>▣</span>
                    Exams
                </a>

                <a href="#">
                    <span>▣</span>
                    Quizzes
                </a>

                <a href="#" class="active">
                    <span>▣</span>
                    Assignments
                </a>

            </nav>

        </aside>


        <main class="main-content">

            <header class="topbar">

                <button class="menu-button">☰</button>

                <div class="profile">

                    <div class="avatar">
                        A
                    </div>

                    <span>Instructor</span>

                </div>

            </header>


            <section class="content">

                <div class="page-header">

                    <h1>Assignments</h1>

                    <button id="openAddPopup">
                        + Add Assignment
                    </button>

                </div>


                <div class="search-section">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search assignments..."
                    >

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Assignment</th>
                                <th>Score</th>
                                <th>Actions</th>
                            </tr>

                        </thead>


                        <tbody id="assignmentsList">

                        </tbody>

                    </table>


                    <div class="table-footer">

                        <p id="assignmentCount">
                            Showing 0 assignments
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <div id="addPopup" class="popup">

        <div class="popup-content">

            <div class="popup-header">

                <h2>Add Assignment</h2>

                <button
                    class="close-button"
                    id="closeAddPopup"
                >
                    ×
                </button>

            </div>


            <label>
                Assignment Name
            </label>

            <input
                type="text"
                id="assignmentName"
                placeholder="Enter assignment name"
            >


            <label>
                Score
            </label>

            <input
                type="number"
                id="assignmentScore"
                placeholder="Enter score"
            >


            <div class="popup-buttons">

                <button
                    class="cancel-button"
                    id="cancelAdd"
                >
                    Cancel
                </button>

                <button
                    class="primary-button"
                    id="addAssignment"
                >
                    Add Assignment
                </button>

            </div>

        </div>

    </div>


    <div id="editPopup" class="popup">

        <div class="popup-content">

            <div class="popup-header">

                <h2>Edit Assignment</h2>

                <button
                    class="close-button"
                    id="closeEditPopup"
                >
                    ×
                </button>

            </div>


            <label>
                Assignment Name
            </label>

            <input
                type="text"
                id="editAssignmentName"
                placeholder="Assignment Name"
            >


            <label>
                Score
            </label>

            <input
                type="number"
                id="editAssignmentScore"
                placeholder="Score"
            >


            <div class="popup-buttons">

                <button
                    class="cancel-button"
                    id="cancelEdit"
                >
                    Cancel
                </button>

                <button
                    class="primary-button"
                    id="saveEdit"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>


    <script src="./js/core/app.js"></script>

</body>

</html>
